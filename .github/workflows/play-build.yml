# Play build: unsigned installers for a `play/*` branch (a throwaway merge of feature branches),
# published as a GitHub pre-release on this repository. Not part of the release process.
name: Play build

on:
  push:
    branches: ["play/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FIGCRAFT_BUILD_SHA: ${{ github.sha }}
  PLAY_VERSION: 0.6.0-megazord.1
  CRAFT_FONTS_REF: 43913056ce82a3fdad0ef69f6b88d1dc922a8104

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    env:
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream python3-yaml zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -q -p xtask -- version set "$PLAY_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          FIGCRAFT_VERSION: ${{ env.PLAY_VERSION }}
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: play-linux
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: cargo run --locked -q -p xtask -- version set "$PLAY_VERSION"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package (msi, portable zip)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          FIGCRAFT_VERSION: ${{ env.PLAY_VERSION }}
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: play-windows
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -q -p xtask -- version set "$PLAY_VERSION"
      - name: Build and package (dmg)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          FIGCRAFT_VERSION: ${{ env.PLAY_VERSION }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: play-macos
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Pre-release
    needs: [linux, windows, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: play-*
          path: dist
          merge-multiple: true
      - name: Create or replace the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$PLAY_VERSION"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "FigCraft $PLAY_VERSION (play build)" \
            --notes "Unsigned play build of \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::9}): main plus every open feature branch. Not an official release."
